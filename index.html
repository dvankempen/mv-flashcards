<title>MV Flashcards — P2 / T2</title>
<style>
  :root{
    --bg:#1c1420; --card:#2a1f30; --card2:#34273c; --ink:#f3ecf3;
    --muted:#b79fc0; --accent:#a8324a; --accent2:#7d5ba6; --good:#3f9d6d; --line:#4a3a54;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;min-height:100%;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
  header{padding:14px 2px 8px;text-align:center}
  h1{font-size:17px;margin:0;letter-spacing:.02em}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .decks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 6px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--muted);
    padding:6px 11px;border-radius:20px;font-size:13px;cursor:pointer}
  .chip.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .bar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin:4px 2px}
  .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 0}
  .card{width:100%;max-width:520px;min-height:44vh;background:linear-gradient(160deg,var(--card),var(--card2));
    border:1px solid var(--line);border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .tag{position:relative;align-self:flex-start;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:auto}
  .q{font-size:21px;font-weight:600;margin:auto 0}
  .a{font-size:19px;color:#ffe9d6;margin:auto 0;white-space:pre-line}
  .hint{margin-top:auto;font-size:12px;color:var(--muted)}
  .controls{display:flex;gap:8px;max-width:520px;width:100%;margin:10px auto 4px}
  .btn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:13px;border-radius:12px;font-size:15px;cursor:pointer}
  .btn:active{transform:scale(.98)}
  .btn.good{background:var(--good);border-color:var(--good);color:#fff}
  .btn.again{background:var(--accent);border-color:var(--accent);color:#fff}
  .foot{display:flex;gap:8px;max-width:520px;width:100%;margin:0 auto 8px}
  .mini{flex:1;background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px;border-radius:10px;font-size:12px;cursor:pointer}
  .done{text-align:center;color:var(--muted);max-width:520px;margin:auto}
</style>
</head>

 // Bodem

 {d:"Bodem",q:"Textuur → waterbeschikbaarheid",a:"Klei: veel gebonden water · leem: meest beschikbaar · zand: weinig"},

 {d:"Bodem",q:"Terroir (Horstink)",a:"Systeem van natuurlijke factoren (klimaat, bodem+oorsprong) + de mens; effet millésime"},
 // Proeven (P2)
 {d:"Proeven",q:"P2 antwoordstructuur (volgorde)",a:"Conclusie → kleur → aroma's → alcohol% → zuur → structuur → houtbeleid → vinificatie"},
 {d:"Proeven",q:"Aroma vs bouquet",a:"Aroma = geur van jonge wijn; bouquet = geur door rijping (tertiair)"},

 // T2 wijnbereiding
 {d:"T2",q:"Mannoproteïnen (uit gistcel) — rol",a:"Eiwit-/wijnsteenstabiliteit, mondgevoel, sur lie/autolyse (wit, rood, mousserend)"},

 {d:"T2",q:"Rosé — lichtroze kleur",a:"Korte schilcontact / saignée / directe persing"},
 {d:"T2",q:"SO₂ — vrij vs gebonden",a:"Vrij deel is werkzaam; werkzaamheid neemt toe bij lage pH"},
 {d:"T2",q:"Stikstof (YAN) bij gisting",a:"Gistvoeding; tekort → giststress, giststilstand, ongewenste (zwavel)aroma's"},
 {d:"T2",q:"Mousserend (trad. methode) — flesrijping",a:"Rijping op de lie vóór dégorgement; champagne langer dan cava"},

 {d:"T2",q:"Mutage sur grains",a:"Gisting stoppen met alcohol op de schillen (versterkte wijn / VDN)"},
 {d:"T2",q:"Schiltannine vs pittannine",a:"Schil: rijper, zachter; pit: groener, harder/bitterder"},
 // Getallen
 {d:"Getallen",q:"Actieve drempeltemperatuur wijnstok",a:"10 °C"},
 {d:"Getallen",q:"Optimum fotosynthese",a:"± 20–22 °C (groei-optimum 23–25 °C)"},
 {d:"Getallen",q:"Beste rode kwaliteit: ETR/ETP",a:"≈ 0,4–0,6"},
 {d:"Getallen",q:"Optimale bodem-pH",a:"5,2 – 7,5"},
 {d:"Getallen",q:"Hogere alcoholen vs esters (orde)",a:"± 200 mg/l hogere alcoholen · ± 2–4 mg/l esters"},
 {d:"Getallen",q:"Totaal zuurgehalte wijn (orde)",a:"± 4–7 g/l"},
 {d:"Getallen",q:"Veel zuur = welke pH?",a:"Lage pH (lage zuurgraad); weinig zuur = hoge pH"},
 // Les 7 — Aroma's & smaken (Daniëls)
 {d:"Les7",q:"Terpenen — geur & druivenras",a:"Bloemig/druivig (geraniol, linalool, nerol); Muscat, Gewürztraminer"},
 {d:"Les7",q:"Methoxypyrazines (IBMP)",a:"Groene paprika/vegetaal; marker van ONrijpheid; breekt af door zon; Cabernet, Carmenère"},
 {d:"Les7",q:"Rotundone",a:"Peper (sesquiterpeen); Syrah, Grüner Veltliner; méér in koel klimaat/hoge opbrengst"},
 {d:"Les7",q:"TDN / goût de pétrole",a:"Kerosine; carotenoïde-afbraak; bijna exclusief Riesling; door zon/warmtestress; primair van oorsprong"},
 {d:"Les7",q:"Esters — waardoor gestuurd?",a:"Gistingstemperatuur (optimaal 15–18 °C); niet stabiel (± -40% na 7 mnd)"},
 {d:"Les7",q:"Ethylacetaat vs isoamylacetaat",a:"Ethylacetaat = nagellak (neg.); isoamylacetaat = perendrop; vetzure ethylesters = ananas/anijs"},
 {d:"Les7",q:"Diacetyl — geur & herkomst",a:"Boter; uit de malolactische omzetting (appelzuur→melkzuur), veel bij lange koele malo"},
 {d:"Les7",q:"Thiolen (4MMP, 3MH, 3MHA)",a:"Passievrucht/buxus/grapefruit; variëtaal (Sauvignon Blanc ≫ Chardonnay); thiol-gisten VL3/X5/QA23"},
 {d:"Les7",q:"Reductie (H₂S) — oorzaak & voorkomen",a:"Tekort O₂/stikstof(YAN)→vluchtige zwavel; voorkom: YAN, voorklaring, gistkeuze, geen zwavel vlak vóór oogst"},
 {d:"Les7",q:"Spontane gisting — risico",a:"Niet-Saccharomyces vroeg actief, vallen weg >±4% alcohol; meer complexiteit maar risico azijnzuur/vluchtige fenolen"},
 {d:"Les7",q:"Brett — stoffen & omstandigheden",a:"4-ethylfenol/ethylguaiacol (stal); hoge pH, veel extract, oud hout, warme kelder; bestrijd: hygiëne/SO₂/filtratie/chitosan"},
 {d:"Les7",q:"Sulfiet — actieve vorm",a:"Moleculair SO₂; sterk pH-afhankelijk (pH 4,0 ≈ 10× meer nodig dan pH 3,0). EU: wit 200, rood 150 mg/l"},
 {d:"Les7",q:"Frans vs Amerikaans eik",a:"Frans (Q. petraea): compacter, meer tannine, subtieler · Amerikaans (Q. alba): meer toast/kokos/vanille"},
 {d:"Les7",q:"Druiftannine — schil vs pit",a:"Schil: rijper/zachter · pit: groener/astringenter · wijntannine: complexer, met kleur (pigmented = stabieler)"},
 {d:"Les7",q:"Rode draad Wine Flavors",a:"Druif = bouwstenen (variëtaal) · gisting = vineus karakter · opvoeding = complexiteit; gist maakt geen voetafdruk die niet in de druif zit — behalve fouten"},
 // Les 8 — Oenologische procedés (Horstink)
 {d:"Les8",q:"Definitie 'wijn' (EU 1308/2013)",a:"Product uitsluitend verkregen door (gehele/gedeeltelijke) alcoholische vergisting van verse druiven of druivenmost"},
 {d:"Les8",q:"Waar staan de oenologische procedés?",a:"Verordening (EU) 2019/934; aanbevolen door het OIV (na experimentele onderbouwing)"},
 {d:"Les8",q:"EAV / PAV / TAV / NAV",a:"Effectief / Potentieel (uit restsuiker) / Totaal (E+P) / Natuurlijk (vóór verrijking) alcoholvolume"},
 {d:"Les8",q:"Suiker → alcohol vuistregel",a:"± 17,5 g/l suiker ≈ 1 % vol alcohol"},
 {d:"Les8",q:"Verrijking — waarmee & zone?",a:"Sucrose of (gerectificeerde) geconc. most, of concentratie; koeler mag méér: zone A max 3%, zone C max 1,5% vol"},
 {d:"Les8",q:"Additief vs technische hulpstof",a:"Additief blijft bestanddeel (sulfiet, wijnsteenzuur); hulpstof gebruikt tijdens proces, mag alleen onschadelijke residuen laten (gelatine, bentoniet, enzym)"},
 {d:"Les8",q:"Aanzuring / ontzuring — max",a:"Max 4 g/l aanzuren, 1 g/l ontzuren (in wijnsteenzuur); aanzuren en verrijken sluiten elkaar uit"},
 {d:"Les8",q:"Wijnsteenstabiliteit — oplossingen",a:"Koudebehandeling (weken 4–5°C of uren rond vriespunt met entstof); of in oplossing houden: metawijnsteenzuur, mannoproteïnen, CMC, kaliumpolyaspartaat"},
 {d:"Les8",q:"Mannoproteïnen — herkomst & werking",a:"Uit gistcelwand, komen vrij bij sur lie; voorkomen wijnsteenneerslag, verbeteren eiwitstabiliteit, ronder mondgevoel"},
 {d:"Les8",q:"Stukjes eikenhout — voorwaarden",a:"Alleen Quercus; verhit maar niet verbrand/koolstofhoudend; geen aroma-versterkende toevoeging; min. 2 mm"},
 // Les 9 — Bourgondische vinificatie (de Graaf)
 {d:"Les9",q:"Chardonnay — karakter",a:"Neutraal 'allemansvriend', weinig eigen terpenen, vroeg rijpend, van nature hoge zuurgraad"},
 {d:"Les9",q:"Pinot noir — karakter",a:"Cool-climate, kalkminnend, dunne schil, moeilijk te verbouwen; hoge tannine (1609 mg/kg) maar instabiele anthocyanen; optimaal ± 35 hl/ha"},
 {d:"Les9",q:"Débourbage statique",a:"Most laten bezinken 10–18 °C, ± 24 u; bourbes = 'voedsel voor de wijn'; evt. klaring bentoniet/caseïne"},
 {d:"Les9",q:"Streef-pH van de most",a:"Wit 3,1–3,2 · rood 3,3–3,35 (pinot noir wijn ideaal pH 3,45–3,55)"},
 {d:"Les9",q:"Malo — wat & wanneer wel/niet",a:"Appelzuur→melkzuur: ronder, biologisch stabiel; rood vrijwel altijd; wit niet altijd (verlies frisheid, overschaduwt aroma)"},
 {d:"Les9",q:"MSF vs MPF",a:"MSF (Accad): koude inweking ± 10°C met veel SO₂ · MPF: koude preferm. inweking 10–13°C, 3–6 dgn → minder kleur/tannine, meer fruit (Henri Jayer)"},
 {d:"Les9",q:"Pigeage vs remontage + trend",a:"Pigeage = hoed onderdompelen (kleur/structuur); remontage = rondpompen (homogeniseren, zuurstof). Trend: minder pigeage → zachtere extractie, meer fruit"},
 {d:"Les9",q:"Ontstelen vs hele trossen",a:"Ontsteeld: minder harde tannine, meer fruit/frisheid · vendanges entières: meer structuur/complexiteit, meer flesrijping, risico groene stelen"},
 {d:"Les9",q:"Cuvaison",a:"Het hele proces van inweking + gisting; duurt ± 3–4 weken"},
 {d:"Les9",q:"Gistingstemperatuur rood",a:"28–30 °C; te hoog → gevaar acidité volatile (vluchtig zuur)"},
 {d:"Les9",q:"Gistsoorten & alcoholtolerantie",a:"Saccharomyces cerevisiae actief tot ± 14%; daarboven S. bayanus nodig"},
 {d:"Les9",q:"Frans eiken — herkomst & pièce",a:"Wintereik (ONF): Vosges, Allier, Tronçais, Bertranges; duigen 2–3 jr drogen; pièce Bourgogne = 228 l"},
 {d:"Les9",q:"Premox",a:"Voortijdige oxidatie van witte bourgogne (1996–2003), oorzaak onzeker; o.a. laag vrij SO₂ bij botteling, bâtonnage, lage persdruk, hoge rendementen"},
 {d:"Les9",q:"Klimaatverandering — kernprobleem",a:"Suikerrijpheid loopt vóór op fenolische/aromatische rijpheid; warme jaren = loggere wijnen die terroir overschaduwen"}
];
CARDS.forEach((c,i)=>c.id=i);

const KEY="mv_flash_known_v1";
let known=JSON.parse(localStorage.getItem(KEY)||"{}");
let deck="Alle", hideKnown=false, order=[], pos=0, showingA=false;

const decks=["Alle",...[...new Set(CARDS.map(c=>c.d))]];
const dc=document.getElementById("decks");
decks.forEach(d=>{const b=document.createElement("button");b.className="chip"+(d===deck?" on":"");b.textContent=d;b.onclick=()=>{deck=d;build();paintChips()};dc.appendChild(b)});
function paintChips(){[...dc.children].forEach(b=>b.classList.toggle("on",b.textContent===deck))}

function pool(){return CARDS.filter(c=>(deck==="Alle"||c.d===deck)&&(!hideKnown||!known[c.id]))}
function build(){order=pool().map(c=>c.id);pos=0;showingA=false;render()}
function shuffleDeck(){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;showingA=false;render()}
function toggleHideKnown(){hideKnown=!hideKnown;document.getElementById("hk").textContent="Verberg geweten: "+(hideKnown?"aan":"uit");build()}
function resetProgress(){if(confirm("Voortgang wissen?")){known={};localStorage.setItem(KEY,"{}");build()}}
function flip(){showingA=!showingA;render()}
function mark(ok){const id=order[pos];if(ok)known[id]=1;else delete known[id];localStorage.setItem(KEY,JSON.stringify(known));next()}
function next(){if(pos<order.length-1){pos++;showingA=false;render()}else{build();if(order.length)render()}}

function render(){
  const card=document.getElementById("card");
  const knownCount=CARDS.filter(c=>known[c.id]).length;
  document.getElementById("knownc").textContent="geweten: "+knownCount+"/"+CARDS.length;
  if(!order.length){card.innerHTML='<div class="done">Geen kaarten in deze selectie.<br>Zet «Verberg geweten» uit of kies een ander deck.</div>';document.getElementById("progress").textContent="0 / 0";return}
  const c=CARDS.find(x=>x.id===order[pos]);
  document.getElementById("progress").textContent=(pos+1)+" / "+order.length+"  ·  "+c.d;
  card.innerHTML='<div class="tag">'+c.d+(known[c.id]?" ✓":"")+'</div>'+
    (showingA?'<div class="a">'+esc(c.a)+'</div>':'<div class="q">'+esc(c.q)+'</div>')+
    '<div class="hint">'+(showingA?"tik = vraag":"tik = antwoord")+'</div>';
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
build();
</script>
